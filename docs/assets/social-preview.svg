<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent Context Lens social preview</title>
  <desc id="desc">Audit the context your coding agents actually consume.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f96ff"/>
      <stop offset="1" stop-color="#315ff4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1140" cy="76" r="230" fill="#315ff4" opacity="0.10"/>
  <circle cx="1020" cy="610" r="310" fill="#6f96ff" opacity="0.06"/>
  <rect x="72" y="66" width="112" height="112" rx="30" fill="#f4ede1"/>
  <text x="128" y="143" text-anchor="middle" fill="#111722" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800">CY</text>
  <rect x="160" y="138" width="42" height="10" rx="5" fill="#315ff4"/>
  <text x="72" y="264" fill="#f4ede1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Agent Context Lens</text>
  <text x="72" y="326" fill="#aebbd0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30">Audit the context your coding agents actually consume</text>
  <rect x="72" y="374" width="1136" height="188" rx="24" fill="#0b0d12" stroke="#29364b" stroke-width="2"/>
  <text x="104" y="422" fill="#8fa3bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">$ agent-context-lens .</text>
  <text x="104" y="468" fill="#f4ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">Score: <tspan fill="#5dd39e" font-weight="700">100/100</tspan></text>
  <text x="104" y="510" fill="#c7d2e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">Context: 1 file · ~208 tokens</text>
  <text x="735" y="466" fill="#6f96ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">LOCAL · DETERMINISTIC</text>
  <text x="735" y="510" fill="#aebbd0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">No model. No API key.</text>
  <rect x="72" y="596" width="1136" height="4" rx="2" fill="url(#accent)"/>
</svg>
