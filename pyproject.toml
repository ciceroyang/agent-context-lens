[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-context-lens"
version = "0.2.0"
description = "Local context observability for coding-agent instructions and MCP configuration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Cicero Yang" },
]
keywords = [
  "ai-agents",
  "coding-agents",
  "context-engineering",
  "mcp",
  "codex",
  "claude-code",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
agent-context-lens = "agent_context_lens.cli:main"

[project.urls]
Homepage = "https://github.com/ciceroyang/agent-context-lens"
Issues = "https://github.com/ciceroyang/agent-context-lens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_context_lens"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
