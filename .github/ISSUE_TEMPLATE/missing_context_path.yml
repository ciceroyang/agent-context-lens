name: Missing context path
description: Request discovery of an agent instruction, rule, skill, or MCP path.
title: "[Path]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form when Agent Context Lens misses a documented context path.
        Link to primary documentation when it exists.
  - type: input
    id: tool
    attributes:
      label: Agent tool or editor
      placeholder: Codex, Claude Code, Cursor, Copilot, Windsurf, MCP client
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Path pattern
      placeholder: .example/rules/*.md
    validations:
      required: true
  - type: input
    id: documentation
    attributes:
      label: Primary documentation
      description: Link to the vendor or project's documentation for this path.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: How the file affects agent context
      description: Explain when the tool loads the file and whether it is repository-scoped.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal safe fixture
      description: Provide a sanitized directory tree or tiny example.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private paths, and proprietary instructions.
          required: true
