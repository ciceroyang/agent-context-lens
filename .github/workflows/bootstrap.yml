name: Publish source tree

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows src/agent_context_lens tests
          printf '%s' '' | base64 --decode > '.github/workflows/ci.yml'
          printf '%s' 'X19weWNhY2hlX18vCioucHlbY29kXQoucHl0ZXN0X2NhY2hlLwoucnVmZl9jYWNoZS8KLmNvdmVyYWdlCmRpc3QvCmJ1aWxkLwoqLmVnZy1pbmZvLwoudmVudi8KcmVwb3J0Lmpzb24KcmVwb3J0Lm1kCgo=' | base64 --decode > '.gitignore'
          printf '%s' '' | base64 --decode > 'AGENTS.md'
          printf '%s' '' | base64 --decode > 'LICENSE'
          printf '%s' '' | base64 --decode > 'pyproject.toml'
          printf '%s' 'IiIiQXVkaXQgY29kaW5nLWFnZW50IGNvbnRleHQgd2l0aG91dCBzZW5kaW5nIHJlcG9zaXRvcnkgZGF0YSB0byBhIG1vZGVsLiIiIgoKZnJvbSAuc2Nhbm5lciBpbXBvcnQgQ29udGV4dEZpbGUsIEZpbmRpbmcsIFJlcG9ydCwgc2NhbgoKX19hbGxfXyA9IFsiQ29udGV4dEZpbGUiLCAiRmluZGluZyIsICJSZXBvcnQiLCAic2NhbiJdCl9fdmVyc2lvbl9fID0gIjAuMS4wIgoK' | base64 --decode > 'src/agent_context_lens/__init__.py'
          printf '%s' 'ZnJvbSAuY2xpIGltcG9ydCBtYWluCgpyYWlzZSBTeXN0ZW1FeGl0KG1haW4oKSkKCg==' | base64 --decode > 'src/agent_context_lens/__main__.py'
          printf '%s' '' | base64 --decode > 'src/agent_context_lens/cli.py'
          printf '%s' '' | base64 --decode > 'src/agent_context_lens/scanner.py'
          printf '%s' '' | base64 --decode > 'tests/test_scanner.py'
          git rm -- '.github/workflows/bootstrap.yml'
      - name: Verify release
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
          agent-context-lens . --fail-under 80
      - name: Publish release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish agent-context-lens source"
          git push
